name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Type Check
        run: npm run typecheck || echo "No typecheck script found"
        
      - name: Lint
        run: npm run lint
        
      - name: Build
        run: npm run build
        
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
        
      # M1: Require tests for security rules to be in place (can fail if not written yet, but required)
      # - name: Test Firebase Rules
      #   run: firebase emulators:exec "npm test"
        
  deploy_development:
    name: Deploy to Development
    needs: build_and_test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build for Development
        run: npm run build
        env:
          VITE_APP_ENV: DEVELOPMENT
      - name: Check Firebase Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_DEV || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_8AC4F }}" ]; then
            echo "has_sa=true" >> $GITHUB_OUTPUT
          else
            echo "has_sa=false" >> $GITHUB_OUTPUT
            echo "::notice::Firebase deployment skipped: No Firebase Service Account secret found in GitHub Secrets."
          fi
      - name: Deploy to Firebase
        if: steps.check_credentials.outputs.has_sa == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_DEV || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_8AC4F }}'
          projectId: ${{ secrets.FIREBASE_PROJECT_ID || 'groundwork-8ac4f' }}
          channelId: live

  deploy_staging:
    name: Deploy to Staging
    needs: build_and_test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build for Staging
        run: npm run build
        env:
          VITE_APP_ENV: STAGING
      - name: Check Firebase Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_8AC4F }}" ]; then
            echo "has_sa=true" >> $GITHUB_OUTPUT
          else
            echo "has_sa=false" >> $GITHUB_OUTPUT
            echo "::notice::Firebase deployment skipped: No Firebase Service Account secret found in GitHub Secrets."
          fi
      - name: Deploy to Firebase
        if: steps.check_credentials.outputs.has_sa == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_8AC4F }}'
          projectId: ${{ secrets.FIREBASE_PROJECT_ID || 'groundwork-staging' }}
          channelId: live

  deploy_production:
    name: Deploy to Production
    needs: build_and_test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build for Production
        run: npm run build
        env:
          VITE_APP_ENV: PRODUCTION
      - name: Check Firebase Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_PROD || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_8AC4F }}" ]; then
            echo "has_sa=true" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_sa=false" >> $GITHUB_OUTPUT
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice title=Deployment Notice::Firebase deployment skipped: To enable automatic deployment on push, add FIREBASE_SERVICE_ACCOUNT (or FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_PROD) to your GitHub repository secrets."
          fi
      - name: Deploy to Firebase Hosting via Service Account
        if: steps.check_credentials.outputs.has_sa == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_PROD || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GROUNDWORK_8AC4F }}'
          projectId: ${{ secrets.FIREBASE_PROJECT_ID || 'groundwork-8ac4f' }}
          channelId: live
      - name: Deploy to Firebase Hosting via Token
        if: steps.check_credentials.outputs.has_token == 'true' && steps.check_credentials.outputs.has_sa != 'true'
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project "${{ secrets.FIREBASE_PROJECT_ID || 'groundwork-8ac4f' }}"
